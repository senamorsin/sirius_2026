[project]
name = "sirius-proj"
version = "0.1.0"
description = "Локальная проверка технической документации по чек-листу"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyside6>=6.12.0",
    "python-docx>=1.2.0",
    "pypdf>=6.0",
    "openpyxl>=3.1.5",
    "numpy>=2.2",
    "onnxruntime>=1.23",
    "tokenizers>=0.22",
    "httpx>=0.28",
    "huggingface-hub>=0.36",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=6", "ruff>=0.14", "radon>=6", "python-pptx>=1.0", "reportlab>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
sirius-proj = "sirius_proj:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
