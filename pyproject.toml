[project]
name = "sirius-proj"
version = "0.1.0"
description = "Локальная проверка технической документации по чек-листу"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-docx>=1.2.0",
    "pypdf>=6.0",
    "openpyxl>=3.1.5",
    "numpy>=2.2",
    "onnxruntime>=1.23",
    "tokenizers>=0.22",
    "httpx>=0.28",
    "pyside6-essentials>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6",
    "ruff>=0.14",
    "radon>=6",
    "python-pptx>=1.0",
    "reportlab>=4.4",
    "mutmut>=3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/sirius_proj/domain/evidence.py", "src/sirius_proj/adapters/llama_client.py"]
also_copy = ["examples/"]
pytest_add_cli_args_test_selection = ["tests/test_core.py", "tests/test_boundaries.py", "tests/test_search_service.py", "tests/test_llama.py"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long Russian document prose and bibliographic URLs are intentional.
"scripts/create_defense.py" = ["E501"]

[project.scripts]
sirius-proj = "sirius_proj:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
